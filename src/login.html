<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Tracker — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse at 50% 0%, #1e1b4b 0%, #0f172a 65%);
    }

    .auth-card {
      width: 420px;
      background: #1e293b;
      border-radius: 20px;
      border: 1px solid #334155;
      padding: 40px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon { font-size: 50px; display: block; margin-bottom: 12px; }
    .logo-title { font-size: 22px; font-weight: 700; }
    .logo-sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }

    .tabs {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }

    .tab {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active { background: #6366f1; color: white; }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      color: #f1f5f9;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #6366f1; }

    .btn-main {
      width: 100%;
      padding: 13px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-main:hover { background: #4f46e5; }
    .btn-main:disabled { opacity: 0.55; cursor: not-allowed; }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="auth-card">

    <div class="logo">
      <span class="logo-icon">📊</span>
      <div class="logo-title">Attendance Tracker</div>
      <div class="logo-sub">Keep your attendance above 80%</div>
    </div>

    <!-- Login / Sign Up Tabs -->
    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="tab"        id="signupTab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden"></div>

    <!-- ===== LOGIN FORM ===== -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password">
      </div>
      <button class="btn-main" id="loginBtn">Login →</button>
    </div>

    <!-- ===== SIGN UP FORM ===== -->
    <div id="signupForm" class="hidden">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password (min. 6 characters)</label>
        <input type="password" id="signupPassword" placeholder="Create a password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Repeat your password">
      </div>
      <button class="btn-main" id="signupBtn">Create Account →</button>
    </div>

  </div>

  <!-- Firebase SDKs loaded from Google's CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <!-- Your config file -->
  <script src="firebase-config.js"></script>

  <script>
    // ─── Initialize Firebase ─────────────────────────────────
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // If user is already logged in, skip to dashboard
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'dashboard.html';
    });

    // ─── Tab Switching ───────────────────────────────────────
    function switchTab(tab) {
      hideAlert();
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('loginTab').classList.add('active');
        document.getElementById('signupTab').classList.remove('active');
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.remove('hidden');
        document.getElementById('loginTab').classList.remove('active');
        document.getElementById('signupTab').classList.add('active');
      }
    }

    // ─── Alert Helpers ───────────────────────────────────────
    function showAlert(msg) {
      const el = document.getElementById('alertBox');
      el.textContent = msg;
      el.className = 'alert alert-error';
      el.classList.remove('hidden');
    }
    function hideAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    // ─── Translate Firebase error codes to friendly messages ──
    function friendlyError(code) {
      const map = {
        'auth/user-not-found':     'No account found with this email.',
        'auth/wrong-password':     'Incorrect password. Please try again.',
        'auth/invalid-email':      'Please enter a valid email address.',
        'auth/email-already-in-use': 'This email is already registered. Try logging in.',
        'auth/weak-password':      'Password must be at least 6 characters.',
        'auth/too-many-requests':  'Too many attempts. Please wait a moment.',
        'auth/invalid-credential': 'Email or password is incorrect.',
      };
      return map[code] || 'Something went wrong. Please try again.';
    }

    // ─── LOGIN ───────────────────────────────────────────────
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn      = document.getElementById('loginBtn');

      if (!email || !password) { showAlert('Please fill in all fields.'); return; }

      btn.textContent = 'Logging in…';
      btn.disabled = true;
      hideAlert();

      try {
        await auth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged above will redirect to dashboard
      } catch (err) {
        showAlert(friendlyError(err.code));
        btn.textContent = 'Login →';
        btn.disabled = false;
      }
    });

    // ─── SIGN UP ─────────────────────────────────────────────
    document.getElementById('signupBtn').addEventListener('click', async () => {
      const email    = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm  = document.getElementById('signupConfirm').value;
      const btn      = document.getElementById('signupBtn');

      if (!email || !password || !confirm) { showAlert('Please fill in all fields.'); return; }
      if (password !== confirm)            { showAlert('Passwords do not match.'); return; }
      if (password.length < 6)            { showAlert('Password must be at least 6 characters.'); return; }

      btn.textContent = 'Creating account…';
      btn.disabled = true;
      hideAlert();

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        // onAuthStateChanged will redirect to dashboard
      } catch (err) {
        showAlert(friendlyError(err.code));
        btn.textContent = 'Create Account →';
        btn.disabled = false;
      }
    });

    // Allow pressing Enter to submit
    document.getElementById('loginPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
    document.getElementById('signupConfirm').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('signupBtn').click();
    });
  </script>
</body>
</html>
